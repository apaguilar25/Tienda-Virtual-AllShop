<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil — AllShop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>@media(max-width:820px){#profLayout{grid-template-columns:1fr !important;}}</style>
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="container">
      <h1>Mi perfil</h1>
      <div class="grid" style="grid-template-columns: 1fr 1fr; gap:20px;" id="profLayout">
        <div class="card">
          <div class="text-center">
            <img id="avatarPreview" src="" alt="Avatar" style="width:100px;height:100px;border-radius:50%;object-fit:cover;background:var(--surface-2);margin:0 auto 12px;"/>
          </div>
          <form class="form" id="profileForm">
            <div class="field"><label>Nombre</label><input id="name" required/></div>
            <div class="field"><label>Avatar (URL)</label><input id="avatar" type="url" placeholder="https://..."/></div>
            <div class="field"><label>Dirección de envío</label><input id="address"/></div>
            <button class="btn" type="submit">Guardar cambios</button>
          </form>
        </div>
        <div class="card">
          <h3>Mis pedidos</h3>
          <div id="myOrders"></div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
