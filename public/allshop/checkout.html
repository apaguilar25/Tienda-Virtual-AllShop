<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — AllShop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* Hacer esto acá para no afectar otras páginas */
  /* En computadoras (pantallas grandes) se divide en dos columnas */
  @media (min-width: 821px) {
    #checkoutLayout {
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
  }
  /* En móviles (menor a 820px) se vuelve una sola columna vertical */
  @media (max-width: 820px) {
    #checkoutLayout {
      grid-template-columns: 1fr !important;
      gap: 16px;
    }
  }
</style>
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="container">
      <h1>Checkout</h1>
      <div class="grid" id="checkoutLayout">
        <form class="card form" id="payForm">
          <h3>Datos de envío</h3>
          <div class="field"><label>Nombre completo</label><input id="fullName" required /></div>
          <div class="field"><label>Dirección</label><input id="address" required /></div>
          <h3>Datos de la tarjeta</h3>
          <div class="field"><label>Número de tarjeta</label><input id="ccNum" inputmode="numeric" maxlength="19" placeholder="4111 1111 1111 1111" required /></div>
          <div class="grid" >
            <div class="field"><label>Expira (MM/AA)</label><input id="ccExp" placeholder="12/29" required /></div>
            <div class="field"><label>CVV</label><input id="ccCvv" inputmode="numeric" maxlength="4" required /></div>
          </div>
          <button class="btn btn-block" type="submit">Pagar</button>
          <div class="error-msg" id="payMsg"></div>
        </form>
        <div class="card cart-summary" id="sum"></div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
