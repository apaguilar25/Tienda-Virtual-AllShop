<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito — AllShop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>@media(max-width:820px){#cartLayout{grid-template-columns:1fr !important;}}</style>
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="container">
      <h1>Tu carrito</h1>
      <div class="grid" style="grid-template-columns: 2fr 1fr; gap:20px;" id="cartLayout">
        <div class="card" id="cartItems"></div>
        <div class="card cart-summary" id="cartSummary"></div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
