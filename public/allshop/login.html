<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — AllShop</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="container auth-wrap">
      <div class="card">
        <h1>Iniciar sesión</h1>
        <form class="form" id="loginForm">
          <div class="field"><label>Correo</label><input type="email" id="email" required/></div>
          <div class="field"><label>Contraseña</label><input type="password" id="password" required/></div>
          <button class="btn btn-block" type="submit">Entrar</button>
          <div class="error-msg" id="msg"></div>
        </form>
        <p class="mt-16"><a href="forgot.html">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        <p class="text-muted" style="font-size:.85rem;">Admin demo: admin@allshop.com / admin123</p>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>initLogin();</script>
</body>
</html>
