<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña — AllShop</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="container auth-wrap">
      <div class="card">
        <h1>Recuperar contraseña</h1>
        <p class="text-muted">Ingresa tu correo y establece una nueva contraseña.</p>
        <form class="form" id="forgotForm">
          <div class="field"><label>Correo</label><input type="email" id="email" required/></div>
          <div class="field"><label>Nueva contraseña</label><input type="password" id="newPassword" required minlength="6"/></div>
          <button class="btn btn-block" type="submit">Restablecer</button>
          <div class="error-msg" id="msg"></div>
        </form>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>initForgot();</script>
</body>
</html>
