<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — AllShop</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="container auth-wrap">
      <div class="card">
        <h1>Crear cuenta</h1>
        <form class="form" id="registerForm">
          <div class="field"><label>Nombre</label><input id="name" required/></div>
          <div class="field"><label>Correo</label><input type="email" id="email" required/></div>
          <div class="field"><label>Contraseña</label><input type="password" id="password" required minlength="6"/></div>
          <button class="btn btn-block" type="submit">Registrarme</button>
          <div class="error-msg" id="msg"></div>
        </form>
        <p class="mt-16">¿Ya tienes cuenta? <a href="login.html">Entra</a></p>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>initRegister();</script>
</body>
</html>
