<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Premium Store</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/catalog.css">
</head>
<body>

    <nav class="ios-nav">
        <div class="brand"><a href="index.html" style="color:inherit;">Estudio Comercial</a></div>
        <div class="nav-links">
            <a href="auth.html">Mi Cuenta</a>
            <button id="cart-toggle-btn" class="ios-btn ios-btn-primary" style="padding: 6px 14px;">🛒 Cart (<span id="cart-count">0</span>)</button>
            <button id="theme-toggle-btn" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <div class="catalog-layout">
        <aside class="ios-card filters-sidebar">
            <h3>Filtros</h3>
            <div class="filter-group">
                <label>Buscador</label>
                <input type="text" id="search-input" class="ios-input" placeholder="Buscar producto...">
            </div>
            <div class="filter-group">
                <label>Categoría</label>
                <select id="category-filter" class="ios-input">
                    <option value="all">Todas</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Precio Máximo: $<span id="price-val">200</span></label>
                <input type="range" id="price-filter" min="0" max="1000" step="10" value="1000" style="width:100%;">
            </div>
        </aside>

        <main class="products-grid" id="catalog-products-container">
            </main>
    </div>

    <div id="product-modal" class="ios-modal hidden">
        <div class="ios-modal-content ios-card">
            <button class="close-modal-btn" id="close-detail-modal">×</button>
            <div id="modal-product-detail-body">
                </div>
        </div>
    </div>

    <div id="cart-modal" class="ios-modal hidden">
        <div class="ios-modal-content ios-card">
            <button class="close-modal-btn" id="close-cart-modal">×</button>
            <h2>Tu Bolsa de Compra</h2>
            <div id="cart-items-container"></div>
            
            <div class="cart-summary">
                <p>Subtotal: <span id="cart-subtotal">$0.00</span></p>
                <h3>Total: <span id="cart-total">$0.00</span></h3>
            </div>

            <form id="checkout-form" class="checkout-form">
                <h3>Pasarela Segura</h3>
                <input type="text" id="card-name" class="ios-input" placeholder="Nombre en tarjeta" required>
                <input type="text" id="card-number" class="ios-input" placeholder="0000 0000 0000 0000" maxlength="19" required>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="card-exp" class="ios-input" placeholder="MM/AA" maxlength="5" required>
                    <input type="password" id="card-cvv" class="ios-input" placeholder="CVV" maxlength="3" required>
                </div>
                <button type="submit" class="ios-btn ios-btn-primary" style="margin-top:10px;">Pagar y Crear Orden</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/catalog.js"></script>
    <script type="module" src="js/cart.js"></script>
</body>
</html>
