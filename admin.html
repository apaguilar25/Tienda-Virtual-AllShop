<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <nav class="ios-nav">
        <div class="brand">Consola Administrativa</div>
        <div class="nav-links">
            <a href="catalog.html">Ver Catálogo</a>
            <button id="theme-toggle-btn" class="theme-toggle">🌙</button>
        </div>
    </nav>

    <main class="admin-layout">
        <section class="metrics-grid">
            <div class="ios-card metric-box">
                <h4>Ingresos Totales</h4>
                <p id="metric-revenue">$0.00</p>
            </div>
            <div class="ios-card metric-box">
                <h4>Usuarios</h4>
                <p id="metric-users">Registrados: 0 | Activos: 1</p>
            </div>
            <div class="ios-card metric-box chart-box">
                <h4>Top 3 Más Vendidos (u.)</h4>
                <div id="pure-css-chart" class="chart-container">
                    </div>
            </div>
        </section>

        <section class="ios-card crud-section">
            <div class="crud-header">
                <h2>Gestión de Inventario</h2>
                <button id="btn-open-create" class="ios-btn ios-btn-primary">+ Crear Producto</button>
            </div>
            <div style="overflow-x:auto;">
                <table class="ios-table">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Título</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body"></tbody>
                </table>
            </div>
        </section>

        <section class="ios-card sales-section" style="margin-top:30px;">
            <h2>Historial de Órdenes y Envíos</h2>
            <div style="overflow-x:auto; margin-top:15px;">
                <table class="ios-table">
                    <thead>
                        <tr>
                            <th>Orden ID</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="sales-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="product-form-modal" class="ios-modal hidden">
        <div class="ios-modal-content ios-card">
            <button class="close-modal-btn" id="close-form-modal">×</button>
            <h2 id="modal-form-title">Nuevo Producto</h2>
            <form id="crud-form" style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">
                <input type="hidden" id="form-product-id">
                
                <label class="form-lbl">Nombre del Producto</label>
                <input type="text" id="form-title" class="ios-input" required>
                
                <label class="form-lbl">Categoría</label>
                <input type="text" id="form-category" class="ios-input" required>
                
                <label class="form-lbl">Precio ($)</label>
                <input type="number" id="form-price" step="0.01" class="ios-input" required>
                
                <label class="form-lbl">Stock Inicial</label>
                <input type="number" id="form-stock" class="ios-input" required>
                
                <label class="form-lbl">URL de Imagen</label>
                <input type="url" id="form-image" class="ios-input" required>
                
                <label class="form-lbl">Descripción</label>
                <textarea id="form-description" class="ios-input" style="height:8px;" required></textarea>

                <button type="submit" class="ios-btn ios-btn-primary" style="margin-top:10px;">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
