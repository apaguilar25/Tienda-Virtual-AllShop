<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Premium Store</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

    <header class="top-nav-bar">
        <div class="nav-title">Catálogo</div>
        <button id="theme-toggle" class="nav-btn">🌓</button>
    </header>

    <main style="padding: 16px;">
        <div class="search-container">
            <input type="text" id="search-box" placeholder="🔍 Buscar productos..." class="bar-search">
        </div>

        <div class="filters-row">
            <select id="cat-filter" class="pill-selector"><option value="all">Categorías</option></select>
            <select id="price-filter" class="pill-selector">
                <option value="all">Precios</option>
                <option value="low">Hasta $50</option>
                <option value="mid">$50 - $100</option>
                <option value="high">Más de $100</option>
            </select>
        </div>

        <div class="grid-products" id="store-grid"></div>

        <section class="bag-section">
            <h2 style="font-size: 22px; margin-bottom: 12px;">Tu Bolsa de Compras</h2>
            <div class="input-fields-group" id="bag-list"></div>
            
            <div class="card-opinion" style="margin-bottom: 20px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>Subtotal</span><span id="bag-sub">$0.00</span></div>
                <div style="display:flex; justify-content:space-between; font-weight:700;"><span>Total</span><span id="bag-tot">$0.00</span></div>
            </div>

            <form id="pay-form">
                <h3 style="font-size: 16px; margin-bottom: 10px;">Información Financiera</h3>
                <div class="input-fields-group">
                    <input type="text" placeholder="Número de Tarjeta" class="field-input" required pattern="\d{16}">
                    <input type="text" placeholder="MM/AA" class="field-input" required style="width:50%; display:inline-block;">
                    <input type="text" placeholder="CVC" class="field-input" required pattern="\d{3}" style="width:48%; display:inline-block;">
                </div>
                <button type="submit" class="btn-prime">Confirmar Pago Seguro</button>
            </form>
        </section>
    </main>

    <nav class="bottom-tab-bar">
        <a href="index.html" class="tab-link"><span class="tab-icon">✨</span><span>Inicio</span></a>
        <a href="tienda.html" class="tab-link active"><span class="tab-icon">🛍️</span><span>Catálogo</span></a>
        <a href="cuenta.html" class="tab-link" id="tab-user-node"><span class="tab-icon">👤</span><span>Perfil</span></a>
        <a href="admin.html" class="tab-link" id="tab-admin-node" style="display: none;"><span class="tab-icon">📊</span><span>Admin</span></a>
    </nav>

    <footer class="app-footer">
        <div id="network-badge" class="status-indicator">● Estado</div>
        <p>&copy; 2026 Premium Store Engineering.</p>
    </footer>

    <script type="module" src="js/pages/tienda-page.js"></script>
</body>
</html>
