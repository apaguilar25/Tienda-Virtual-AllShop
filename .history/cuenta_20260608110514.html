<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Cuenta</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cuenta.css">
</head>
<body>

    <header class="top-nav-bar">
        <div class="nav-title" id="page-title-context">Sesión</div>
        <button id="logout-btn" class="nav-btn" style="display: none;">Salir</button>
    </header>

    <main style="padding: 16px;">
        <section id="guest-zone">
            <div class="segmented-control">
                <button id="trigger-login" class="segment-btn active">Ingresar</button>
                <button id="trigger-reg" class="segment-btn">Registrarse</button>
            </div>

            <form id="login-form">
                <div class="input-fields-group">
                    <input type="email" id="log-email" placeholder="Correo" class="field-input" required>
                    <input type="password" id="log-pass" placeholder="Contraseña" class="field-input" required>
                </div>
                <button type="submit" class="btn-prime">Iniciar Sesión</button>
                <button type="button" id="forget-pass" class="nav-btn" style="display:block; width:100%; text-align:center; margin-top:15px;">¿Contraseña olvidada?</button>
            </form>

            <form id="reg-form" style="display: none;">
                <div class="input-fields-group">
                    <input type="text" id="reg-name" placeholder="Nombre completo" class="field-input" required>
                    <input type="email" id="reg-email" placeholder="Correo electrónico" class="field-input" required>
                    <input type="password" id="reg-pass" placeholder="Clave de seguridad" class="field-input" required>
                    <input type="url" id="reg-avatar" placeholder="URL Imagen de Perfil" class="field-input">
                    <input type="text" id="reg-address" placeholder="Dirección de Despacho" class="field-input">
                    <select id="reg-role" class="field-input">
                        <option value="client">Perfil: Cliente</option>
                        <option value="admin">Perfil: Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn-prime">Completar Registro</button>
            </form>
        </section>

        <section id="user-zone" style="display: none;">
            <div class="profile-avatar-view">
                <img id="avatar-target" src="" alt="Avatar" class="avatar-round">
                <h2 id="name-target" style="font-size: 22px;">Usuario</h2>
            </div>

            <form id="profile-edit-form">
                <h3 style="font-size: 14px; color:var(--text-muted); margin-bottom:8px;">Datos de Envío y Contacto</h3>
                <div class="input-fields-group">
                    <input type="text" id="edit-name" placeholder="Nombre" class="field-input" required>
                    <input type="text" id="edit-address" placeholder="Dirección" class="field-input" required>
                    <input type="url" id="edit-avatar" placeholder="URL Avatar" class="field-input">
                </div>
                <button type="submit" class="btn-prime">Actualizar Información</button>
            </form>
        </section>
    </main>

    <nav class="bottom-tab-bar">
        <a href="index.html" class="tab-link"><span class="tab-icon">✨</span><span>Inicio</span></a>
        <a href="tienda.html" class="tab-link"><span class="tab-icon">🛍️</span><span>Catálogo</span></a>
        <a href="cuenta.html" class="tab-link active"><span class="tab-icon">👤</span><span>Perfil</span></a>
        <a href="admin.html" class="tab-link" id="tab-admin-node" style="display: none;"><span class="tab-icon">📊</span><span>Admin</span></a>
    </nav>

    <script type="module" src="js/pages/cuenta-page.js"></script>
</body>
</html>
