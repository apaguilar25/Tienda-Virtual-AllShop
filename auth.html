<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta - Premium Store</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <nav class="ios-nav">
        <div class="brand"><a href="index.html" style="color:inherit;">Estudio Comercial</a></div>
        <button id="theme-toggle-btn" class="theme-toggle">🌙</button>
    </nav>

    <main class="auth-container">
        <section id="auth-forms-box" class="ios-card auth-card">
            <div class="tabs-auth">
                <button id="tab-login" class="tab-btn active">Entrar</button>
                <button id="tab-register" class="tab-btn">Registro</button>
            </div>

            <form id="form-login" class="auth-form active">
                <input type="email" id="login-email" class="ios-input" placeholder="Correo electrónico" required>
                <input type="password" id="login-pass" class="ios-input" placeholder="Contraseña" required>
                <button type="submit" class="ios-btn ios-btn-primary">Iniciar Sesión</button>
                <p class="forgot-link"><a href="#" id="go-recover">¿Olvidaste tu contraseña?</a></p>
            </form>

            <form id="form-register" class="auth-form">
                <input type="text" id="reg-name" class="ios-input" placeholder="Nombre completo" required>
                <input type="email" id="reg-email" class="ios-input" placeholder="Correo electrónico" required>
                <input type="password" id="reg-pass" class="ios-input" placeholder="Contraseña" required>
                <button type="submit" class="ios-btn ios-btn-primary">Crear Cuenta</button>
            </form>

            <form id="form-recover" class="auth-form">
                <h3>Recuperar cuenta</h3>
                <p style="font-size:13px; color:var(--ios-text-secondary); margin-bottom:15px;">Introduce tu correo y te enviaremos una clave temporal simulada.</p>
                <input type="email" id="recover-email" class="ios-input" placeholder="Tu correo electrónico" required>
                <button type="submit" class="ios-btn ios-btn-primary">Enviar enlace</button>
                <p class="forgot-link"><a href="#" id="back-to-login">Volver al login</a></p>
            </form>
        </section>

        <section id="profile-box" class="ios-card profile-card hidden">
            <div class="profile-header">
                <img id="profile-avatar" src="" alt="Avatar">
                <div>
                    <h2 id="profile-title-name">Nombre</h2>
                    <span id="profile-role-badge" class="role-badge">Cliente</span>
                </div>
            </div>
            
            <form id="form-profile" class="profile-form">
                <label>Nombre Completo</label>
                <input type="text" id="prof-name" class="ios-input" required>
                
                <label>URL del Avatar</label>
                <input type="url" id="prof-avatar-url" class="ios-input" required>
                
                <label>Dirección de Envío</label>
                <input type="text" id="prof-address" class="ios-input" required>

                <div class="profile-actions">
                    <button type="submit" class="ios-btn ios-btn-primary">Guardar Cambios</button>
                    <button type="button" id="btn-logout" class="ios-btn ios-btn-danger">Cerrar Sesión</button>
                </div>
                <div id="admin-shortcut-container" class="hidden" style="margin-top: 20px;">
                    <a href="admin.html" class="ios-btn ios-btn-primary" style="width:100%; background-color:var(--ios-success)">Entrar al Panel Admin</a>
                </div>
            </form>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
